<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Catálogo de produtos">
<title>Catálogo de Produtos</title>
<style>
:root{
  --black:#111111;
  --gold:#b78932;
  --gold-light:#9b7025;
  --white:#ffffff;
  --gray:#555555;
  --bg:#ffffff;
  --card:#ffffff;
  --line:#e7e1d7;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:#111111;
  line-height:1.45;
}
a{text-decoration:none;color:inherit}
.container{width:min(1160px,calc(100% - 28px));margin:auto}

/* Header */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,0,0,.08);
}
.header-inner{
  min-height:72px;display:flex;align-items:center;
  justify-content:space-between;gap:14px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:48px;height:48px;border-radius:10px;object-fit:contain;
  background:#fff;
}
.brand-name{font-size:15px;font-weight:800;white-space:nowrap;color:#111}
.brand-sub{font-size:10px;color:#666;letter-spacing:1.1px;text-transform:uppercase}

.whatsapp{
  display:inline-flex;align-items:center;justify-content:center;
  gap:8px;background:#25d366;color:#fff;
  border-radius:999px;padding:11px 16px;font-size:13px;font-weight:800;
  white-space:nowrap;
  transition:background .2s ease, transform .15s ease;
}
.whatsapp:hover{background:#1ebe57;transform:scale(1.03)}
.whatsapp svg{width:22px;height:22px;flex-shrink:0}

/* Hero */
.hero{padding:8px 0 12px}
.hero-box{
  min-height:220px;border:1px solid rgba(0,0,0,.08);
  border-radius:22px;padding:32px 22px;
  display:flex;flex-direction:column;justify-content:center;
  background:#fafafa;
  position:relative;overflow:hidden;
}
.kicker{
  color:#111;font-size:12px;text-transform:uppercase;
  letter-spacing:2px;font-weight:700;
}
h1{
  font-size:clamp(26px,6.5vw,42px);
  line-height:1.1;letter-spacing:-1.2px;
  max-width:700px;margin:10px 0 12px;color:#111;font-weight:800;
}
.hero-copy{
  color:#111;max-width:920px;font-size:clamp(18px,4.8vw,30px);
  line-height:1.18;font-weight:900;letter-spacing:-.5px;
}
.hero-whatsapp{position:absolute;right:18px;top:50%;transform:translateY(-50%);
  width:190px;height:58px;padding:0;font-size:16px;font-weight:800;
  gap:9px;box-shadow:0 3px 10px rgba(0,0,0,.12);
}
.hero-whatsapp svg{width:28px;height:28px}


/* Categories pills */
.categories{
  display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 22px;
}
.category-pill{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.03);
  color:#111;border-radius:999px;padding:9px 14px;
  font-size:12px;font-weight:700;
  transition:border-color .2s, color .2s;
}
.category-pill:hover{border-color:#111;color:#000}

/* Search */
.search-area{padding:0 0 22px}
.search-box{position:relative}
.search-input{
  width:100%;height:48px;
  border:1px solid var(--line);border-radius:14px;
  background:#fff;color:#111;
  padding:0 44px 0 16px;font:inherit;font-size:15px;outline:none;
}
.search-input::placeholder{color:#999}
.search-input:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.search-icon{
  position:absolute;right:15px;top:50%;transform:translateY(-50%);
  color:#666;font-size:17px;pointer-events:none;
}
.search-status{margin-top:9px;color:var(--gray);font-size:12px}

/* Category sections */
.category{scroll-margin-top:90px;margin:0 0 40px}
.category-title{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.category-title:before{
  content:"";display:block;width:4px;height:22px;background:#111;border-radius:4px;
}
.category h2{font-size:20px;letter-spacing:-.4px;color:#111;font-weight:800}
.category-count{margin-left:auto;color:var(--gray);font-size:12px}

/* Product grid */
.grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
}
.product{
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 2px 10px rgba(0,0,0,.04);
  border-radius:14px;overflow:hidden;
}
.product-img{
  width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f5f5f5;
  cursor:pointer;
  transition:opacity .2s ease;
}
.product-img:hover{opacity:.92}
.product-info{padding:11px 12px 14px}
.product-name{
  font-size:13px;font-weight:700;min-height:36px;color:#111;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.price{
  font-size:15px;font-weight:800;color:#111;margin-top:5px;
}

/* Empty */
.empty-state{
  padding:32px 16px;border:1px dashed var(--line);border-radius:16px;
  color:var(--gray);text-align:center;font-size:14px;
}

/* Footer */
footer{
  margin-top:20px;border-top:1px solid var(--line);
  padding:28px 0 40px;background:#fafafa;
}
.footer-inner{
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
}
.footer-title{font-weight:800;font-size:15px;color:#111}
.footer-copy{font-size:12px;color:var(--gray);margin-top:4px}
.footer-whatsapp{margin-left:auto}

@media(min-width:650px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .hero-box{min-height:0;height:104px;padding:10px 220px 10px 40px}
  .hero-whatsapp{right:28px}
}
@media(min-width:980px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
}

/* Lightbox / visualizador de imagem */
.lightbox{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.92);
  padding:16px;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
.lightbox.is-open{
  display:flex;
}
.lightbox-content{
  width:min(96vw,720px);
  max-height:94vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.lightbox-img{
  max-width:96vw;
  max-height:76vh;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:8px;
  box-shadow:0 8px 40px rgba(0,0,0,.45);
  pointer-events:none;
  touch-action:none;
}
.lightbox-info{
  width:min(96vw,620px);
  background:#fff;
  border-radius:14px;
  padding:12px 14px 14px;
  text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.28);
}
.lightbox-name{
  font-size:16px;
  line-height:1.3;
  font-weight:800;
  color:#111;
}
.lightbox-price{
  font-size:17px;
  font-weight:800;
  color:#111;
  margin-top:4px;
}
.lightbox-whatsapp{
  width:50px;
  height:50px;
  margin:10px auto 0;
  border:none;
  border-radius:50%;
  background:#25d366;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
  transition:transform .15s ease, background .2s ease;
}
.lightbox-actions{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.lightbox-actions .lightbox-whatsapp{margin:0}
.lightbox-share{width:50px;height:50px;border:none;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.lightbox-share:active{transform:scale(.96)}
.lightbox-share svg{width:25px;height:25px}
.lightbox-whatsapp:hover{background:#1ebe57;transform:scale(1.05)}
.lightbox-whatsapp:active{transform:scale(.96)}
.lightbox-whatsapp svg{width:27px;height:27px}
.lightbox-close{
  position:absolute;
  top:14px;
  right:14px;
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-size:32px;
  font-weight:700;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.35);
  z-index:10001;
  transition:transform .15s ease, background .15s ease;
}
.lightbox-close:hover{
  background:#f0f0f0;
  transform:scale(1.08);
}
.lightbox-close:active{
  transform:scale(.96);
}
body.lightbox-open{
  overflow:hidden;
}
@media(max-width:650px){
  .hero{padding:2px 0 8px}
  .hero-box{min-height:0;height:104px;padding:10px 200px 10px 18px;border-radius:18px}
  .hero-copy{font-size:clamp(17px,5vw,22px);font-weight:900}
  .hero-whatsapp{right:12px;width:172px;height:50px;font-size:14px}
  .lightbox{padding:12px}
  .lightbox-content{gap:8px;max-height:94vh}
  .lightbox-img{max-height:68vh;max-width:94vw}
  .lightbox-info{padding:10px 12px 12px}
  .lightbox-name{font-size:14px}
  .lightbox-price{font-size:16px}
  .lightbox-whatsapp{width:46px;height:46px;margin-top:8px}
  .lightbox-whatsapp svg{width:25px;height:25px}
}

<style>
/* Menu lateral de categorias: painel retrátil e visual discreto */
.category-menu-bar{padding:4px 0 18px;display:flex;align-items:center}
.category-menu-trigger{

}
.category-drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:1001;width:min( min(340px, 88vw), 340px);

  transform:translateX(-102%);visibility:hidden;transition:transform .24s ease,visibility .24s ease;
  display:flex;flex-direction:column;padding:0 16px 18px;overflow:hidden

        <span>Compartilhar</span>

<script>
/*
==========================================================
EDITAR CATÁLOGO — ADICIONE SEUS PRODUTOS AQUI
==========================================================

Para adicionar produtos, edite o objeto CONFIG abaixo. As categorias já estão prontas; coloque cada produto dentro de products da categoria desejada.

Formato de cada produto:
{
  name: "Nome do produto",
  price: "R$ 99,90",
  image: "images/produtos/foto.jpg"   // ou URL completa
}

Dica: coloque as fotos na pasta images/produtos/
==========================================================
*/

const CONFIG = {
  categories: [
    {
      id: "casa-utilidades",
      name: "Casa e Utilidades",
      products: []
    },
    {
      id: "eletronicos-e-eletrodomesticos",
      name: "Eletrônicos e Eletrodomésticos",
      products: [
        {
          name: "Máquina de cortar cabelo turbo 3696",
          price: "R$65,00",
          image: "https://ik.imagekit.io/lre78hgzyi/file_00000000eb10820eb21c1c89fd3e4693.png"
        }
      ]
    },
    {
      id: "cosmeticos",
      name: "Cosméticos",
      products: []
    },
    {
      id: "moda-feminina",
      name: "Moda Feminina",
      products: []
    },
    {
      id: "moda-masculina",
      name: "Moda Masculina",
      products: []
    },
    {
      id: "moda-infantil",
      name: "Moda Infantil",
      products: []
    },
    {
      id: "brinquedos",
      name: "Brinquedos",
      products: []
    },
    {
      id: "bolsas-malas-e-mochilas",
      name: "Bolsas Malas e Mochilas",
      products: []
    }
  ,
    {
      id: "bicicletas",
      name: "Bicicletas",
      products: []
    }
]
};


function normalizeText(text) {
  return String(text)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function getProducts() {
  return CONFIG.categories.flatMap(cat =>
    cat.products.map(product => ({
      ...product,
      categoryId: cat.id,
      categoryName: cat.name
    }))
  );
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}


function fallbackImageData(productName) {
  const safe = String(productName)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
      <rect width="900" height="900" fill="#f5f5f5"/>
      <rect x="55" y="55" width="790" height="790" rx="28" fill="#ffffff" stroke="#e7e1d7" stroke-width="3"/>
      <text x="450" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#111111">${safe}</text>
      <text x="450" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#777777">Imagem do produto</text>
    </svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

function protectProductImages() {
  document.querySelectorAll(".product-img").forEach(img => {
    img.addEventListener("error", function () {
      if (this.dataset.fallbackApplied === "1") return;
      this.dataset.fallbackApplied = "1";
      this.src = fallbackImageData(this.alt || "Produto");
    });
    // Clique/toque na imagem abre o visualizador
    if (!img.dataset.lightboxBound) {
      img.dataset.lightboxBound = "1";
      img.addEventListener("click", function () {
        openLightbox(this.currentSrc || this.src, this.alt, this.dataset.price || "");
      });
    }
  });
}

function render(searchTerm = "") {
  const nav = document.getElementById("categoryNav");
  const catalog = document.getElementById("catalog");
  const status = document.getElementById("searchStatus");
  const query = normalizeText(searchTerm);

  nav.innerHTML = CONFIG.categories.map(cat =>
    `<a class="category-drawer-link" href="#${cat.id}">${escapeHtml(cat.name)}<span aria-hidden="true">›</span></a>`
  ).join("");

  let totalVisible = 0;

  catalog.innerHTML = CONFIG.categories.map(cat => {
    const products = cat.products.filter(product =>
      !query || normalizeText(product.name).includes(query)
    );

    totalVisible += products.length;

    return `
      <section class="category" id="${cat.id}">
        <div class="category-title">
          <h2>${escapeHtml(cat.name)}</h2>
          <span class="category-count">${products.length} ${products.length === 1 ? "item" : "itens"}</span>
        </div>
        ${products.length ? `<div class="grid">
          ${products.map(product => `
            <article class="product">
              <img class="product-img" src="${escapeHtml(product.image)}" alt="${escapeHtml(product.name)}" data-price="${escapeHtml(product.price)}" loading="lazy">
              <div class="product-info">
                <div class="product-name">${escapeHtml(product.name)}</div>
                <div class="price">${escapeHtml(product.price)}</div>
              </div>
            </article>
          `).join("")}
        </div>` : `<div class="empty-state">Adicione produtos nesta categoria editando o objeto CONFIG no final do arquivo.</div>`}
      </section>
    `;
  }).join("");

  if (query && totalVisible === 0) {
    catalog.innerHTML = `<div class="empty-state">Nenhum produto encontrado para “${escapeHtml(searchTerm)}”.</div>`;
  }

  protectProductImages();

  const totalProducts = getProducts().length;
  status.textContent = query
    ? `${totalVisible} ${totalVisible === 1 ? "produto encontrado" : "produtos encontrados"} de ${totalProducts}.`
    : `${CONFIG.categories.length} categorias prontas para receber produtos.`;
}

const categoryDrawer = document.getElementById("categoryDrawer");
const categoryBackdrop = document.getElementById("categoryBackdrop");
const openCategoriesButton = document.getElementById("topCategoriesLink");
const closeCategoriesButton = document.getElementById("closeCategories");

function openCategoryDrawer() {
  categoryDrawer.classList.add("is-open");
  categoryBackdrop.classList.add("is-open");
  categoryDrawer.setAttribute("aria-hidden", "false");
  categoryBackdrop.setAttribute("aria-hidden", "false");
  openCategoriesButton.setAttribute("aria-expanded", "true");
  document.body.classList.add("category-drawer-open");
  closeCategoriesButton.focus();
}

function closeCategoryDrawer() {
  categoryDrawer.classList.remove("is-open");
  categoryBackdrop.classList.remove("is-open");
  categoryDrawer.setAttribute("aria-hidden", "true");
  categoryBackdrop.setAttribute("aria-hidden", "true");
  openCategoriesButton.setAttribute("aria-expanded", "false");
  document.body.classList.remove("category-drawer-open");
  openCategoriesButton.focus();
}

openCategoriesButton.addEventListener("click", openCategoryDrawer);
closeCategoriesButton.addEventListener("click", closeCategoryDrawer);
categoryBackdrop.addEventListener("click", closeCategoryDrawer);
document.getElementById("categoryNav").addEventListener("click", function(event) {
  if (event.target.closest("a")) closeCategoryDrawer();
});
document.addEventListener("keydown", function(event) {
  if (event.key === "Escape" && categoryDrawer.classList.contains("is-open")) {
    closeCategoryDrawer();
  }
});

const searchInput = document.getElementById("productSearch");
searchInput.addEventListener("input", event => {
  render(event.target.value);
});

/* Lightbox */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxName = document.getElementById("lightboxName");
const lightboxPrice = document.getElementById("lightboxPrice");
const lightboxShare = document.getElementById("lightboxShare");
const lightboxClose = document.getElementById("lightboxClose");
let scrollY = 0;
let currentLightboxProduct = { name: "", price: "" };

function openLightbox(src, alt, price) {
  scrollY = window.scrollY || window.pageYOffset;
  currentLightboxProduct = { name: alt || "Produto", price: price || "" };
  lightboxImg.src = src;
  lightboxImg.alt = alt || "Produto";
  lightboxName.textContent = currentLightboxProduct.name;
  lightboxPrice.textContent = currentLightboxProduct.price;
  lightbox.classList.add("is-open");
  document.body.classList.add("lightbox-open");
  document.body.style.position = "fixed";
  document.body.style.top = `-${scrollY}px`;
  document.body.style.left = "0";
  document.body.style.right = "0";
  document.body.style.width = "100%";
}

function closeLightbox() {
  if (!lightbox.classList.contains("is-open")) return;
  lightbox.classList.remove("is-open");
  document.body.classList.remove("lightbox-open");
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.left = "";
  document.body.style.right = "";
  document.body.style.width = "";
  window.scrollTo(0, scrollY);
  lightboxImg.removeAttribute("src");
  lightboxImg.alt = "";
  lightboxName.textContent = "";
  lightboxPrice.textContent = "";
  currentLightboxProduct = { name: "", price: "" };
}

lightboxClose.addEventListener("click", function (e) {
  e.stopPropagation();
  closeLightbox();
});

async function shareLightboxProduct() {
  if (!currentLightboxProduct.name) return;
  const text = `${currentLightboxProduct.name}\nPreço: ${currentLightboxProduct.price}`;
  const imageUrl = lightboxImg.currentSrc || lightboxImg.src;
  try {
    const response = await fetch(imageUrl, { mode: "cors", cache: "no-cache" });
    if (!response.ok) throw new Error("Falha ao baixar imagem");
    const blob = await response.blob();
    const file = new File([blob], "produto.jpg", { type: blob.type || "image/jpeg" });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ title: currentLightboxProduct.name, text, files: [file] });
      return;
    }
    if (navigator.share) { await navigator.share({ title: currentLightboxProduct.name, text: `${text}\n${imageUrl}` }); return; }
  } catch(e) { if (e && e.name === "AbortError") return; }
  window.prompt("Copie o link para compartilhar o produto:", `${text}\n${imageUrl}`);
}

lightboxShare.addEventListener("click", function(e){ e.stopPropagation(); shareLightboxProduct(); });



lightbox.addEventListener("click", function (e) {
  if (e.target === lightbox) {
    closeLightbox();
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" || e.key === "Esc") {
    closeLightbox();
  }
});

/* Impede gesto de pinça / zoom no lightbox */
lightbox.addEventListener("touchmove", function (e) {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener("gesturestart", function (e) {
  if (lightbox.classList.contains("is-open")) {
    e.preventDefault();
  }
});


/* Navegação superior e retorno suave ao topo */
const topHomeLink = document.getElementById("topHomeLink");
const topCategoriesLink = document.getElementById("topCategoriesLink");
if (topCategoriesLink) {
  topCategoriesLink.addEventListener("click", function (event) {
    event.preventDefault();
    openCategoryDrawer();
  });
}

const backToTop = document.getElementById("backToTop");
if (backToTop) {
  backToTop.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

render();
</script>
