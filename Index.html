<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo online de produtos.">
  <meta name="theme-color" content="#f8f9fb">

  <title>Catálogo Online</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#inicio" aria-label="Página inicial">
      <span class="brand-logo" aria-hidden="true">C</span>
      <span class="brand-name">Sua marca</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="category-sidebar"
    >
      Categorias
    </button>
  </header>

  <main id="inicio">
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">CATÁLOGO DIGITAL</p>
      <h1 id="hero-title">Explore nosso catálogo</h1>
      <p>Conheça nossos produtos em um só lugar.</p>
    </section>

    <section class="catalog" aria-label="Catálogo de produtos">
      <aside id="category-sidebar" class="sidebar" aria-label="Categorias">
        <h2>Categorias</h2>
        <nav id="category-list" aria-label="Filtrar por categoria">
          <!-- As categorias serão adicionadas pelo JavaScript. -->
        </nav>
      </aside>

      <div class="catalog-content">
        <div class="catalog-toolbar">
          <label for="product-search">Pesquisar produtos</label>
          <input
            id="product-search"
            type="search"
            placeholder="Digite o nome de um produto..."
            autocomplete="off"
          >
        </div>

        <p id="product-count" aria-live="polite">Nenhum produto cadastrado.</p>

        <div id="product-grid" class="product-grid">
          <!-- Os produtos serão adicionados pelo JavaScript. -->
        </div>

        <div id="empty-state" class="empty-state">
          <h2>Nosso catálogo está sendo preparado</h2>
          <p>Em breve, os produtos estarão disponíveis aqui.</p>
        </div>
      </div>
    </section>
  </main>

  <dialog id="image-lightbox" aria-label="Imagem ampliada do produto">
    <button
      id="lightbox-close"
      class="lightbox-close"
      type="button"
      aria-label="Fechar imagem ampliada"
    >Fechar</button>
    <img id="lightbox-image" src="" alt="">
    <p id="lightbox-caption"></p>
  </dialog>

  <footer class="site-footer">
    <p>Catálogo online</p>
  </footer>
</body>
</html>
